name: kasirk

services:
  postgres:
    image: postgres:16-alpine
    container_name: kasirk-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: kasir
      POSTGRES_DB: kasirkita
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=192MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=20
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasir -d kasirkita"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.50

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kasirk-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: 3000
      ENABLE_SWAGGER_DOCS: "false"
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=384"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(async r => { const b = await r.text(); process.exit(r.ok && b === '{\"status\":\"ok\"}' ? 0 : 1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 448m
    cpus: 0.50

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
